<!doctype html>
<html><head>
<link rel="stylesheet" href="/src/index.css">
<link rel="stylesheet" href="/src/pages/Auth.css">
<style>
/* isolated probe of IACVT semantics, mirroring Auth.css line 154 */
#probe { color: rgb(1,2,3); border: 1px solid rgb(9,9,9); }
#probe.hit { border-color: var(--color-primary); }
#probe2 { color: rgb(1,2,3); }
#probe2.hit { color: var(--color-primary); }
</style>
</head><body>
<div class="auth-container"><div class="auth-card">
<h1 class="auth-title" id="t">Pantry Snap</h1>
<form class="auth-form"><label>Email</label><input id="inp" type="email"></form>
<button type="button" class="auth-toggle-btn" id="tog">Log in</button>
</div></div>
<div id="probe">p</div><div id="probe2">p2</div>
<script>
async function run(){
  const cs = e => getComputedStyle(e);
  const inp = document.getElementById('inp');
  const t = document.getElementById('t');
  const tog = document.getElementById('tog');
  const pr = document.getElementById('probe');
  const pr2 = document.getElementById('probe2');
  const blurB = cs(inp).borderTopColor, blurS = cs(inp).boxShadow;
  inp.focus();
  const fMatch = inp.matches(':focus');
  await new Promise(r => setTimeout(r, 600));
  const f = cs(inp);
  const focusData = {border: f.borderTopColor, shadow: f.boxShadow, outline: f.outlineStyle, matched: fMatch, activeIsInp: document.activeElement===inp};
  pr.classList.add('hit'); pr2.classList.add('hit');
  const out = {
    varColorPrimary: JSON.stringify(cs(document.documentElement).getPropertyValue('--color-primary')),
    varFontXxxl: JSON.stringify(cs(document.documentElement).getPropertyValue('--font-size-xxxl')),
    title_fontSize: cs(t).fontSize,
    title_color: cs(t).color,
    body_fontSize: cs(document.body).fontSize,
    input_blur_border: blurB, input_blur_shadow: blurS,
    input_focus: focusData,
    input_color: cs(inp).color,
    toggle_base_color: cs(tog).color,
    card_color: cs(document.querySelector('.auth-card')).color,
    PROBE_borderColor_IACVT: cs(pr).borderTopColor,   // expect currentColor rgb(1,2,3) if IACVT->initial
    PROBE_color_IACVT: cs(pr2).color,                  // expect inherited body color if IACVT->inherit
    ua: navigator.userAgent.slice(0,40)
  };
  const s = encodeURIComponent(JSON.stringify(out));
  new Image().src = 'http://127.0.0.1:5311/?d=' + s;
  document.body.insertAdjacentHTML('afterbegin','<pre style="color:#fff">'+JSON.stringify(out,null,1)+'</pre>');
}
window.addEventListener('load', () => setTimeout(run, 300));
</script>
</body></html>
